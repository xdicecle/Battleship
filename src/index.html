<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Battleship</title>
  </head>

  <body>
    <header class="d-flex justify-content-center align-items-center pt-5">
      <h1 class="title">Battleship</h1>
    </header>
    <section
      class="gameContainer container d-flex justify-content-center align-items-center flex-md-row flex-column gap-5 pt-3"
    >
      <div class="gameboardContainer">
        <h2 class="text-center">Player's Board</h2>

        <div id="gameboardPlayer" class="d-flex flex-wrap">

        </div>

      </div>

      <div class="gameboardContainer">
        <h2 class="text-center">Computer's Board</h2>

        <div id="gameboardComputer" class="d-flex flex-wrap rounded-5"> </div>
      </div>

      <div id="attackAccuracyContainer" class=" d-flex flex-column gap-3">
        <h2>Attack Accuracy: <span id="attackAccuracy"></span></h2>
      </div>
    </section>
  </body>
</html>
